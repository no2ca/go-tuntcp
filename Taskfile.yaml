version: '3'

vars:
  TUN_NAME: tun0
  TUN_IP: 10.10.0.1
  TUN_PEER_IP: 10.10.0.2

tasks:
  setup-interface:
    cmds:
      - sudo ip addr add {{.TUN_IP}} peer {{.TUN_PEER_IP}} dev {{.TUN_NAME}}
      - sudo ip link set {{.TUN_NAME}} up
  ping:
    cmds:
      - ping {{.TUN_PEER_IP}}
  curl:
    cmds:
      - curl {{.TUN_PEER_IP}}
  ping-test:
    cmds:
      - task: setup-interface
      - task: ping
  curl-test:
    cmds:
      - task: setup-interface
      - task: curl
  e2e:
    desc: ビルド・起動・IP 割り当て・curl を 1 つのターミナルで実行する (sudo 不要)
    env:
      TUN_NAME: '{{.TUN_NAME}}'
      TUN_IP: '{{.TUN_IP}}'
      TUN_PEER_IP: '{{.TUN_PEER_IP}}'
    cmds:
      - ./scripts/e2e.sh
  test:
    cmds:
      - go test ./...
  test-verbose:
    cmds:
      - go test -v ./...
